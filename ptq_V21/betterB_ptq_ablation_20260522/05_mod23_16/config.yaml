    /backbone/mod4/mod4.0/stack_layers/stack_layers.1/conv/conv.0/conv.0.0_1/Conv:
      'ON': BPU
      InputType: int8
    /backbone/mod4/mod4.0/stack_layers/stack_layers.1/conv/conv.1/conv.1.0_1/Conv:
      'ON': BPU
