[tool:pytest]
norecursedirs =
    .git
    dist
    build
    tools
    configs
    plugins
    tests/data
python_files =
    test_*.py
# doctest_plus = disabled
addopts =
    --strict
    --doctest-modules
    --color=yes
    --durations=10
junit_duration_report = call
markers =
    serial_task: Marking that the task is running in serial mode


[coverage:report]
exclude_lines =
    pragma: no-cover
    warnings
    pass
    rank_zero_warn
    raise NotImplementedError


[isort]
line_length = 79
profile = black
known_third_party = PIL,addict,easydict,fsspec,hatbc,horizon_plugin_pytorch,lmdb,msgpack,numpy,cv2,pycocotools,pytest,scipy,six,termcolor,torch,torchvision,torchaudio,yaml
known_locals = hat,tests,projects
no_lines_before = STDLIB,LOCALFOLDER
sections = FUTURE,STDLIB,FIRSTPARTY,THIRDPARTY,LOCALS,LOCALFOLDER
skip_glob =
    docs/*
    3rdparty/*
    tmp_*

[flake8]
max-line-length = 79
exclude =
    docs/source/projects/pilot/*/*
    docs/source/projects/halo/*/*
    docs/source/projects/superparking/*/*
    projects/pilot/docs/*
    projects/isp/app/*
per-file-ignores =
    # C408: Unnecessary <dict/list/tuple> call - rewrite as a literal.
    examples/*: C408, I251, F403, F405
    plugins/aidi_inference/configs/*: C408
    projects/bigmodel/*: I251
    projects/bigmodel/configs/*: C408, E501, E402
    projects/cloudmodel/*: C408, E402, E501, F401, I251
    projects/pilot/configs/*: C408, E501, E402
    projects/pilot/pack_tools/configs/*/*.py: C408
    projects/pilot/tests/*: C408
    projects/pilot/tools/eval/*: C408, E501
    projects/pilot/tools/train/*: C408
    projects/pilot/tools/production/*: C408
    projects/pilot/tools/fillback_eval/*: C408
    projects/pilot/dev/file_list/*: F401
    projects/pilot/dev/publish/cfg/*: C408, E501
    projects/toolchain/configs/*: C408, E501, E402
    projects/halo/cv/*: C408, E501, I251, F401
    projects/halo/nlu/*: C408, E501, I251
    projects/mono/*: I251, C408
    projects/mono/real3d_multitask/*: C408
    projects/mono/veh_side_multitask/*: C408, E501
    projects/mono/configs/*: C408, E501, E402, I251
    projects/mono/toll_gate/*: C408
    projects/mono/cyclist_wheel_kps/*: C408
    projects/mono/person_multitask/*: C408
    projects/mono/person_cyclist_detection/*: C408
    projects/mono/traffic_light_multitask/*: C408
    projects/mono/traffic_light_night_multitask/*: C408
    projects/mono/traffic_sign_2pe_multitask/*: C408
    projects/fsd/roi_model_config/*: C408
    projects/mono/work_condition_multitask/*: C408
    projects/mono/holistic_path_prediction/*: C408
    projects/mono/traffic_cone_2pe/*: C408
    projects/mono/sparse4d/*: C408
    projects/superparking/configs/*: C408, E501, E402, I251
    projects/superparking/tools/*: C408, E501, E402, I251
    projects/superparking/app/*: C408, E501, E402, E302, I251
    projects/superparking/inference/*: C408, I251
    projects/superparking/tests/*: C408, I251
    projects/toolchain/*: C408, I251, F401, F403
    projects/prediction/*: C408, I251
    projects/fsd/*: C408
    projects/planning/*: C408, I251
    tests/*: C408, I251
    tests/*/__init__.py: F401, F403
    tests/__init__.py: F401, F403
    # F401: imported but unused
    # F403: 'from module import *' used; unable to detect undefined names
    __init__.py: F401, F403
select = B,C,E,F,W,B9,I25
banned-modules =
    pdb = pdb is not allowed
    pdb.* = pdb is not allowed
    pudb = pudb is not allowed
    pudb.* = pudb is not allowed
    projects = projects is not allowed
    projects.* = projects is not allowed
    configs = configs is not allowed
    configs.* = configs is not allowed
doctests = True
verbose = 2
format = pylint
# https://pep8.readthedocs.io/en/latest/intro.html#error-codes
# https://github.com/adamchainz/flake8-comprehensions
# https://github.com/PyCQA/flake8-bugbear
extend-ignore =
    E731,  # Do not assign a lambda expression, use a def
    W503,  # Ignore "Line break occurred before a binary operator"
    E203,  # Ignore "whitespace before ':'"
    I250,  # Unnecessary import alias

[pydocstyle]
convention = pep257
# D104, D107: Ignore missing docstrings in __init__ files and methods.
# D202: Ignore a blank line after docstring (collision with Python Black in decorators).
# D105: Missing docstring in magic method.(TODO)
# D100: Missing docstring in public module.(TODO)
# D102: Missing docstring in public method.(TODO)
# D103: Missing docstring in public function.(TODO)
# D101: Missing docstring in public class.(TODO)
add-ignore = D104,D107,D202,D105,D100,D102,D103,D101

[easy_install]
# index_url=http://pypi.hobot.cc/hobot-local/simple
index_url=https://pypi.hobot.cc/simple


[importlinter]
root_package = hat

[importlinter:contract:1]
name=data, metrics, visualize
type=independence
modules=
    hat.data
    hat.engine
    hat.metrics
    hat.models
    hat.optimizers
    hat.visualize
    hat.profiler
ignore_imports=
    # data
    hat.data.transforms.online_mapping_utils -> hat.visualize.online_mapping
    hat.data.transforms.auto_3dv -> hat.visualize.generate_video 
    hat.data.transforms.auto_3dv -> hat.metrics.bev.bev_discobj_eval 
    hat.data.transforms.auto_3dv -> hat.visualize.online_mapping
    # engine
    hat.engine.* -> hat.callbacks
    hat.engine.* -> hat.profiler.profilers
    hat.engine.processors.* -> hat.profiler.profilers
    hat.engine.ddp_trainer -> hat.models.base_modules.sync_bn
    # profiler
    hat.profiler.model_training_perf -> hat.data.dataloaders.multitask_loader
    hat.profiler.model_training_perf -> hat.callbacks.*
    hat.profiler.dataloader_speed_perf -> hat.data.dataloaders.multitask_loader
    # visualize
    hat.visualize.occflow -> hat.data.datasets.occflow_dataset
    hat.visualize.online_mapping -> hat.models.task_modules.bev.spatial_transfomer
    # models
    hat.models.task_modules.traj_pred.post_process.uniformpath_post_process -> hat.data.datasets.traj_pred_dataset
    hat.models.task_modules.bev.postprocess -> hat.metrics.bev.online_mapping_utils
    # metrics
    hat.metrics.bev.bev_crosspoint -> hat.models.task_modules.bev.crosspt_postprocess_utils
    hat.metrics.bev.bev_crosspoint -> hat.visualize.bev_crosspoint
    hat.metrics.bev.bev_e2e -> hat.models.task_modules.e2e_dynamic.e2e_dynamic_util
    hat.metrics.bev.bev_e2e -> hat.visualize.bev_e2e
    hat.metrics.metric_elevation -> hat.visualize.elevation
    hat.metrics.bev.online_mapping -> hat.visualize.online_mapping
    hat.metrics.semantic_segmentation.segmentation -> hat.visualize.semantic_segmentation.visualize
    hat.metrics.metric_occflow -> hat.data.datasets.occflow_dataset
    hat.metrics.real3d -> hat.visualize.real3d
    hat.metrics.bev_3d -> hat.visualize.bev_3d
    hat.metrics.hpp_metric -> hat.visualize.hpp
    hat.metrics.bev.bev_crosspoint -> hat.models.task_modules.bev.crosspt_postprocess_utils
    hat.metrics.bev.online_mapping -> hat.visualize.online_mapping
    hat.metrics.bev.bev_crosspoint -> hat.visualize.bev_crosspoint
    hat.metrics.bev.bev_e2e -> hat.models.task_modules.e2e_dynamic.e2e_dynamic_util
    hat.metrics.bev.bev_e2e -> hat.visualize.bev_e2e

[importlinter:contract:2]
name=evaluation, metrics
type=forbidden
source_modules=
    hat.metrics
forbidden_modules=
    hat.evaluation
