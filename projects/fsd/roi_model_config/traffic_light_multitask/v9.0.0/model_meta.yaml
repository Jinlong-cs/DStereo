mono_tl_mtl:
  model_name: traffic_light
  train:
    entry: ../../config/traffic_light/multitask.py
    stages: 
      - with_bn
      - freeze_bn_1
      - freeze_bn_2
    resource:
      num_machines: 2
      num_gpus_per_machine: 8
  eval: 
    entry: ../../config/traffic_light/eval_multitask.py
    resource:
      num_machines: 1
      num_gpus_per_machine: 2
