    - contains: {attrs: {cn_medium_type: W_Unknown}}
    - contains: {attrs: {cn_medium_type: P_Unknown1}}
#    - contains: {attrs: {cn_medium_type: P_Unknow_SpeedLimele}}
#    - contains: {attrs: {cn_medium_type: PSL_Unknown}}
#    - contains: {attrs: {cn_medium_type: PR_Unknown}}
#    - contains: {attrs: {cn_medium_type: MSL_Unknown}}
    - contains: {attrs: {cn_medium_type: I_Unknown_circle}}
    - contains: {attrs: {cn_medium_type: I_Unknown_rectangle}}
    - contains: {attrs: {cn_medium_type: GSWB_Unknown}}
    - contains: {attrs: {cn_medium_type: C_Unknown}}
    - contains: {attrs: {cn_medium_type: RSBW_Unknown}}
    - contains: {attrs: {cn_medium_type: GSGW_Unknown}}
    - contains: {attrs: {cn_medium_type: TSBW_Unknown}}
    - contains: {attrs: {cn_medium_type: RouteID_Unknown}}
    - contains: {attrs: {cn_medium_type: U_Unknow}}
    - contains: {attrs: {cn_medium_type: U_Unknown}}
    - contains: {attrs: {cn_medium_type: Unknown}}
    - contains: {attrs: {cn_fp_type: Sign}}
    - contains: {attrs: {sub_match_pred: "no"}}
    - and:
      - contains: {attrs: {sub_match_medium: "no"}}
      - not:
          contains: {attrs: {fix_medium: "yes"}}
    - and:
      - or:
        - contains: {attrs: {Inside: outside}}
        - contains: {attrs: {nested_outside: "yes"}}
      - or:
        - contains: {attrs: {cn_medium_type: P_SpeedLimit}}
        - contains: {attrs: {cn_medium_type: PSL_Other}}
        - contains: {attrs: {cn_medium_type: P_ElectricalSpeedLimit}}
        - contains: {attrs: {cn_medium_type: P_Other_SpeedLimele}}
        - contains: {attrs: {cn_medium_type: ProhibitRemove}}
        - contains: {attrs: {cn_medium_type: PR_Other}}
        - contains: {attrs: {cn_medium_type: Min_SpeedLim}}
        - contains: {attrs: {cn_medium_type: MSL_Other}}
        - contains: {attrs: {cn_medium_type: Prohibit_I}}
        - contains: {attrs: {cn_medium_type: P_Other1}}
        - contains: {attrs: {cn_medium_type: W_Warning}}
        - contains: {attrs: {cn_medium_type: W_Other}}
        - contains: {attrs: {cn_medium_type: sign_Construction}}
        - contains: {attrs: {cn_medium_type: C_Other}}
        - contains: {attrs: {cn_medium_type: sign_back}}
        - and:
          - or:
            - contains: {attrs: {cn_medium_type: I_IndicationCircle}}
            - contains: {attrs: {cn_medium_type: I_IndicationRectangle}}
            - contains: {attrs: {cn_medium_type: I_Other_circle}}
            - contains: {attrs: {cn_medium_type: I_Other_rectangle}}
          - not:
              contains: {attrs: {cn_sub_type: I_SplitDriveLine}}
    - range: {field: $BBOX_HEIGHT, lt: 8}
    - range: {field: $BBOX_WIDTH, lt: 14}
    - and:
      - or:
        - contains: {attrs: {cn_medium_type: sign_Construction}}
        - contains: {attrs: {cn_medium_type: C_Other}}
      - or:
        - range: {field: $BBOX_ASPECT_RATIO, gt: 2}
        - range: {field: $BBOX_ASPECT_RATIO, lt: 0.2}
    - and:
      - or:
        - contains: {attrs: {cn_medium_type: GuideSign_WhiteBlack}}
        - contains: {attrs: {cn_medium_type: GSWB_Other}}
        - contains: {attrs: {cn_medium_type: GSWB_Unknown}}
      - or:
        - range: {field: $BBOX_ASPECT_RATIO, gt: 4}
        - range: {field: $BBOX_ASPECT_RATIO, lt: 0.2}
    - and:
      - or:
        - contains: {attrs: {cn_medium_type: P_SpeedLimit}}
        - contains: {attrs: {cn_medium_type: PSL_Other}}
        - contains: {attrs: {cn_medium_type: P_ElectricalSpeedLimit}}
        - contains: {attrs: {cn_medium_type: P_Other_SpeedLimele}}
        - contains: {attrs: {cn_medium_type: ProhibitRemove}}
        - contains: {attrs: {cn_medium_type: PR_Other}}
        - contains: {attrs: {cn_medium_type: Min_SpeedLim}}
        - contains: {attrs: {cn_medium_type: MSL_Other}}
        - contains: {attrs: {cn_medium_type: I_IndicationRectangle}}
        - contains: {attrs: {cn_medium_type: I_Other_rectangle}}
        - contains: {attrs: {cn_medium_type: RoadSign_BlueWhite}}
        - contains: {attrs: {cn_medium_type: RSBW_Other}}
        - contains: {attrs: {cn_medium_type: GuideSign_GreenWhite}}
        - contains: {attrs: {cn_medium_type: GSGW_Other}}
        - contains: {attrs: {cn_medium_type: TravelSign_BrownWhite}}
        - contains: {attrs: {cn_medium_type: TSBW_Other}}
        - contains: {attrs: {cn_medium_type: sign_back}}
      - or:
        - range: {field: $BBOX_ASPECT_RATIO, gt: 4}
        - range: {field: $BBOX_ASPECT_RATIO, lt: 0.25}
    - and:
      - or:
        - contains: {attrs: {cn_medium_type: W_Warning}}
        - contains: {attrs: {cn_medium_type: W_Other}}
        - contains: {attrs: {cn_medium_type: Prohibit_I}}
        - contains: {attrs: {cn_medium_type: P_Other1}}
        - contains: {attrs: {cn_medium_type: I_IndicationCircle}}
        - contains: {attrs: {cn_medium_type: I_Other_circle}}
      - or:
        - range: {field: $BBOX_ASPECT_RATIO, gt: 3}
        - range: {field: $BBOX_ASPECT_RATIO, lt: 0.3}
