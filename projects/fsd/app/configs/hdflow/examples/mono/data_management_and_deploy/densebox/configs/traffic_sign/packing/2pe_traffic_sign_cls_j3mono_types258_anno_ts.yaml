    - contains: {attrs: {cn_sub_type: I_Unknown_circle}}
    - contains: {attrs: {cn_sub_type: I_Unknown_rectangle}}
    - contains: {attrs: {cn_sub_type: GSWB_Unknown}}
    - contains: {attrs: {cn_sub_type: C_Unknown}}
    - contains: {attrs: {cn_sub_type: RSBW_Unknown}}
    - contains: {attrs: {cn_sub_type: GSBW_Unknown}}
