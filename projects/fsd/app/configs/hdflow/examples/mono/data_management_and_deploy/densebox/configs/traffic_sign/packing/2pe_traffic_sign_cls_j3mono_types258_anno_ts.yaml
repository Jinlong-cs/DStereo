base_classname: traffic_sign
num_classes: 258
remove_empty_images: true
shuffle: true

class_mappers:
- id: null
  match_condiction:
    or:
    - contains: {attrs: {ignore: "yes"}}
    - contains: {attrs: {occlusion: invisible}}
    - contains: {attrs: {cn_sub_type: ""}}
    - contains: {attrs: {cn_sub_type: "0"}}
    - contains: {attrs: {cn_sub_type: W_Unknown}}
    - contains: {attrs: {cn_sub_type: P_Unknown1}}
    - contains: {attrs: {cn_sub_type: P_Unknown2}}
    - contains: {attrs: {cn_sub_type: P_Unknown3}}
