# based v7.2 config
# add AEB_PersonRideBicycle
# add AEB_PersonRideMotorcycle
# @2022.6.16 kaijun01.zhang
base_classname: person                                  # 一级类型名称
num_classes: 50                                         # 类别数量
allow_multi_match: true                                 # 允许一个instance进行多次匹配
default_ignore_full_image: true                         # 未定义的类别使用全图ignore
remove_empty_images: true                               # 删除空图片
shuffle: true                                           # 打乱图片顺序
remove_zh_image_path: true
class_mappers:                                          # 目标类别转换器
- id: 49
  upsample: 3
  match_condiction:                                         # 为真值, 则匹配为该类别
    or:
    - contains: {attrs: {type: NonTarget}}                        # 包含{"attrs": {"type": "NonTarget"}}
- id: 1  #hard case upsample
  name: person
  upsample: 3
  match_condiction:
    or:
      - and:
        - contains: {attrs: {type: Dummy_AEB}}
        - contains: {attrs: {type: AEB_Pedestrian}}
        - or:
          - contains: {attrs: {age: Child}}
          - contains: {attrs: {age: Teenagers}}
  ignore_condiction:
    or:
    - contains: {attrs: {ignore: "yes"}}
    - contains: {attrs: {confidence: VeryLow}}
  hard_condiction:
    and:
    - not:
      contains: {attrs: {ignore: "no"}}
    - or:
      - and:
        - or:
          - contains: {attrs: {type: Sitter}}
          - contains: {attrs: {type: Squatter}}
        - range: {field: $BBOX_HEIGHT, lt: 45}
      - and:
        - range: {field: $BBOX_HEIGHT, lt: 200}
        - contains: {attrs: {occlusion: heavily_occluded}}
      - contains: {attrs: {occlusion: invisible}}
      - contains: {attrs: {confidence: Low}}
      - range: {field: $BBOX_HEIGHT, lt: 37}
      - range: {field: $BBOX_WIDTH, lt: 13}
      - range: {field: $BBOX_ASPECT_RATIO, gt: 5}
      - range: {field: $BBOX_ASPECT_RATIO, lt: 0.2}
      - and:
        - contains: {attrs: {type: Pedestrian}}
        - range: {field: $BBOX_ASPECT_RATIO, lt: 1}
- id: 1  #hard case upsample
  name: person
  upsample: 2
  match_condiction:
