- id: 1  #hard case upsample
  name: person
  upsample: 1
  match_condiction:
    or:
    - contains: {attrs: {type: Others}}
  ignore_condiction:
    or:
    - contains: {attrs: {ignore: "yes"}}
    - contains: {attrs: {confidence: VeryLow}}
    - contains: {attrs: {occlusion: invisible}}
  hard_condiction:
    and:
    - not:
      contains: {attrs: {ignore: "no"}}
    - or:
      - contains: {attrs: {occlusion: heavily_occluded}}
      - contains: {attrs: {confidence: Low}}
      - contains: {attrs: {age: Child}}
      - range: {field: $BBOX_HEIGHT, lt: 80}
      - range: {field: $BBOX_ASPECT_RATIO, lt: 1.2}
- id: 1
  name: person
  match_condiction:
    or:
    - contains: {attrs: {type: Pedestrian}}
    - contains: {attrs: {type: Pedestrians}}
    - contains: {attrs: {type: pedestrian}}
    # - contains: {attrs: {type: Dummy_AEB}}
    # - contains: {attrs: {type: Squatter}}
    - contains: {attrs: {type: OtherPose}}
    - contains: {attrs: {type: WithPersonalTransporter}}
    # - contains: {attrs: {type: Sitter}}
    # - contains: {attrs: {type: Bended}}
    - contains: {attrs: {type: Lier}}
    - contains: {attrs: {type: WithWheelchair}}
    - contains: {attrs: {type: Dummy}}
    - contains: {attrs: {type: OnPoster}}
    - contains: {attrs: {type: Stroller}}
    # - contains: {attrs: {type: Others}}
    - contains: {attrs: {type: Other}}
    - contains: {attrs: {type: other}}
    - contains: {attrs: {type: InVehicle}}
    # cyclist type
    # - contains: {attrs: {type: Cyclist}}
    # - contains: {attrs: {type: Bicyclist}}
    # - contains: {attrs: {type: Motorcyclist}}
    # - contains: {attrs: {type: Tricyclist}}
    # - contains: {attrs: {type: Unknown}}
    # - contains: {attrs: {type: unknown}}
    # - and:
    #   - contains: {attrs: {OverlappedBox: "yes"}}
    #   - or:
    #     - contains: {attrs: {type: PersonRideBicycle}}
    #     - contains: {attrs: {type: PersonPushBicycle}}
    #     - contains: {attrs: {type: PersonRideMotorcycle}}
    #     - contains: {attrs: {type: PersonPushMotorcycle}}
    #     - contains: {attrs: {type: PersonRideTricycle}}
    #     - contains: {attrs: {type: PersnPushTricycle}}
  ignore_condiction:
    or:
    - contains: {attrs: {ignore: "yes"}}
    - contains: {attrs: {confidence: VeryLow}}
  hard_condiction:
    and:
    - not:
        contains: {attrs: {ignore: "yes"}}
    - or:
      - contains: {attrs: {type: Lier}}
      - contains: {attrs: {type: Unknown}}
      - contains: {attrs: {type: unknown}}
      - contains: {attrs: {type: OtherPose}}
      - contains: {attrs: {type: Dummy}}
      - contains: {attrs: {type: OnPoster}}
      - contains: {attrs: {type: Stroller}}
      - contains: {attrs: {type: Others}}
      - contains: {attrs: {type: Other}}
      - contains: {attrs: {type: other}}
      - contains: {attrs: {type: InVehicle}}
      - and:
        - range: {field: $BBOX_HEIGHT, lt: 200}
        - contains: {attrs: {occlusion: heavily_occluded}}
      - contains: {attrs: {occlusion: invisible}}
      - contains: {attrs: {confidence: Low}}
      - range: {field: $BBOX_HEIGHT, lt: 37}
      - range: {field: $BBOX_WIDTH, lt: 13}
      - range: {field: $BBOX_ASPECT_RATIO, gt: 4}
      - range: {field: $BBOX_ASPECT_RATIO, lt: 0.25}
      - and:
        - contains: {attrs: {type: Pedestrian}}
        - range: {field: $BBOX_ASPECT_RATIO, lt: 1}
