        - contains: {attrs: {cn_medium_type: Unknown}}
        - contains: {attrs: {cn_sub_type: U_Unknown}}
    children_box_hard_condiction:
      and:
        - or:
            - contains: {attrs: {cn_sub_type: IR_Ramp}}
            - contains: {attrs: {cn_sub_type: IR_RampArrow}}
            - contains: {attrs: {cn_sub_type: IR_RampAhead}}
            - contains: {attrs: {cn_sub_type: IR_RampDirection}}
            - contains: {attrs: {cn_sub_type: IR_RampInternal}}
            - contains: {attrs: {cn_sub_type: IR_RampOut}}
            - contains: {attrs: {cn_sub_type: IR_RampExit}}
            - contains: {attrs: {cn_medium_type: Ramp}}
            - contains: {attrs: {cn_medium_type: RampArrow}}
        - and:
            - range: {field: $BBOX_HEIGHT, lt: 10}
            - range: {field: $BBOX_WIDTH, lt: 13}
    children_box_positive_condiction:
      or:
        - contains: {attrs: {cn_sub_type: IR_Ramp}}
        - contains: {attrs: {cn_sub_type: IR_RampArrow}}
        - contains: {attrs: {cn_sub_type: IR_RampAhead}}
