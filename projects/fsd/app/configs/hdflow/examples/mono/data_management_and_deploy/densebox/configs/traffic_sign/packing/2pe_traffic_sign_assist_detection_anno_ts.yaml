    - contains: {attrs: {cn_medium_type: Other_GuideSign_WhiteBlack}}
    - contains: {attrs: {cn_medium_type: G_GuideSign_WhiteBlack}}
    - contains: {attrs: {cn_sub_type: GSWB_Other}}
    - contains: {attrs: {cn_sub_type: GSWB_Unknown}}
    - contains: {attrs: {cn_sub_type: GuideSign_WhiteBlack}}
    - contains: {attrs: {cn_sub_type: G_GuideSign_WhiteBlack}}
