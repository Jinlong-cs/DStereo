num_classes: 2                                          # 类别数量
default_ignore_full_image: true                         # 其余类别全图ignore
remove_empty_images: true                               # 删除空图片
remove_zh_image_path: false                             # 删除中文路径图片
shuffle: true                                           # 打乱图片顺序
default_inter_over_minwidth_threshold: 0.85
default_bbox_height_rel_ratio_upperbound: 0.35
default_center_axis_pixel_gap_upperbound: 12
ignore_parent_assist: false
parent_box_classname: traffic_sign
parent_box_remove_condiction:
  or:
    - contains: {attrs: {cn_medium_type: GSWB_Other}}
    - contains: {attrs: {cn_medium_type: GSWB_Unknown}}
