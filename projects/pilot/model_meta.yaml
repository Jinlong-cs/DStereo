resize_2:
  model_name: pilot_multitask_resize2
  train:
    entry: projects/pilot/configs/resize_2/multitask.py
    stages: 
      - with_bn
      - freeze_bn_1
      - freeze_bn_2
      - freeze_bn_3
      - sparse_3d_freeze_bn_1
      - sparse_3d_freeze_bn_2
    resource:
      num_machines: 8
      num_gpus_per_machine: 8
  eval: 
    entry: projects/pilot/configs/resize_2/eval_multitask.py
    resource:
      num_machines: 1
      num_gpus_per_machine: 4
  infer:
    entry: projects/pilot/configs/resize_2/pred_multitask.py

